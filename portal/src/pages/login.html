<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · Kliento Portal</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/_k/portal.css?v=6d">
<script src="/_k/webauthn.js" defer></script>
<script src="/_k/login.js?v=3" defer></script>
</head>
<body>
<main class="auth">
  <div class="authbox">
    <div class="wordmark"><b>kliento</b><span>portal</span></div>

    <section class="card" id="vEmail">
      <h1>Sign in</h1>
      <p class="err" id="emErr" role="alert" hidden></p>
      <form id="emForm" novalidate>
        <div class="fld"><label class="lab" for="email">Email</label><input class="inp" id="email" type="email" autocomplete="username" required></div>
        <div class="fld"><label class="lab" for="password">Password</label><input class="inp" id="password" type="password" autocomplete="current-password" required></div>
        <button class="btn primary wide" type="submit" id="emBtn">Sign in</button>
        <label class="chk"><input type="checkbox" id="remember" checked> Keep me signed in for 30 days</label>
      </form>
      <div class="alt">New here? <a class="linkbtn" href="/join">Create your account</a></div>
      <div class="alt"><button class="linkbtn" type="button" id="pkBtn">Sign in with a passkey instead</button></div>
      <p class="err" id="pkErr" role="alert" hidden></p>
    </section>

    <p class="foot">Private portal for Kliento clients.</p>
  </div>
</main>
</body>
</html>
